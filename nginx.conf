worker_processes 2;

events {
  worker_connections 4096;
}

http {
  gzip on;
  gzip_vary on;
  gzip_comp_level 9;
  gzip_min_length 512;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml application/javascript text/javascript application/x-javascript application/xml image/svg+xml image/x-icon application/json;
  gzip_disable "MSIE [1-6]\.";

  include /etc/nginx/mime.types;

  map $cookie_$NGINX_PARAM_KEY $root_dir_default {
    default public;

    $NGINX_SECRET private;
  }

  map $query_string $root_dir {
    default $root_dir_default;

    $NGINX_PARAM_KEY=$NGINX_SECRET auth;
  }

  map $root_dir $error_page {
    default /index.html;

    private 404.html;
  }

  log_format custom '($server_name) - $root_dir - $remote_addr - $remote_user - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" - ratio: $gzip_ratio';
  access_log /var/log/nginx/access.log custom;

  server_tokens off;

  server {
    server_name _;
    server_tokens off;

    listen 80;

    root /app/$root_dir/;
    index index.html;

    location /assets/ {
      try_files $uri $uri =404;
    }

    location / {
      try_files $uri $uri/ $uri.html $uri.html/ /$error_page;
    }
  }
}
