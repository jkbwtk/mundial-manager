worker_processes 4;

events {
  worker_connections 4096;
}

http {
  gzip on;
  gzip_vary on;
  gzip_comp_level 9;
  gzip_min_length 512;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml application/javascript text/javascript application/x-javascript application/xml image/svg+xml image/x-icon application/json;
  gzip_disable "MSIE [1-6]\.";

  map_hash_max_size 4096;
  map_hash_bucket_size 4096;

  include /etc/nginx/mime.types;

  server_tokens off;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  upstream public {
    server 127.0.0.1:8100;
  }

  upstream auth {
    server 127.0.0.1:8200;
  }

  upstream private {
    server 127.0.0.1:8300;
  }

  upstream backend {
    server 127.0.0.1:5020;
  }

  map $http_x_forwarded_for $NGINX_CLIENT_IP {
    default $http_x_forwarded_for;

    '' $remote_addr;
  }

  map $cookie_$NGINX_PARAM_KEY $upstream_default {
    default public;

    $NGINX_SECRET private;
  }

  map $query_string $upstream {
    default $upstream_default;

    ~^.*$NGINX_PARAM_KEY=$NGINX_SECRET.*$ auth;
  }

  log_format custom '[$cookie_$NGINX_PARAM_KEY] ($server_name) - $upstream - $NGINX_CLIENT_IP - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" - $request_time seconds - uri: $uri';
  access_log /var/log/nginx/access.log custom;

  server {
    server_name _;

    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    listen 8100;

    root /app/public/;

    location / {
      add_header Cache-Control no-cache;
      try_files $uri $uri.html $uri/index.html =404;
    }
  }

  server {
    server_name _;

    error_page 404 /index.html;
    # error_page 500 502 503 504 /index.html;

    listen 8200;

    root /app/auth/;

    location / {
      add_header Cache-Control no-cache;
      limit_req zone=auth burst=5 nodelay;

      try_files $uri $uri.html $uri/index.html =404;
    }
  }

  server {
    server_name _;

    listen 8300;

    root /app/private/;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $NGINX_CLIENT_IP;
      proxy_set_header X-Forwarded-For $NGINX_CLIENT_IP;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass_request_headers on;

      proxy_redirect http://backend /;
      proxy_pass http://backend;
    }
  }

  server {
    server_name _;

    listen 80;

    access_log off;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $NGINX_CLIENT_IP;
      proxy_set_header X-Forwarded-For $NGINX_CLIENT_IP;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass_request_headers on;

      proxy_redirect http://$upstream /;
      proxy_pass http://$upstream;
    }
  }
}
