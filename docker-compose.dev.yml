services:
  db:
    image: postgres:18-alpine
    container_name: mundial-manager-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm_password}
      POSTGRES_DB: ${POSTGRES_DB:-MM_DEV_DB}
    ports:
      - "4300:5432"
    volumes:
      - db_data:/var/lib/postgresql
      
volumes:
  db_data: