<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Test</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>

  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url(/assets/JetBrainsMono-Regular.woff2) format('woff2');
    }

    :root {
      font-size: 10px;
      scrollbar-color: #767676 #0d0d0d;
      scrollbar-width: thin;
    }

    body {
      margin: 0;
      font-family: 'JetBrains Mono', monospace;
      background-color: #0d0d0d;
      font-size: 2rem;
      color: #767676;

      ::selection {
        background-color: #d9d9d9;
        color: #0d0d0d;
      }
    }

    html,
    body {
      min-height: 100dvh;
    }

    #root {
      min-height: inherit;
      position: relative;
    }

    #container {
      position: absolute;

      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      .animation {
        max-width: round(down, 100%, 8px);
        max-height: round(down, 100%, 8px);
      }

      #text {
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div id="container">
    <image src='/assets/spin.gif' class="animation" alt='Loading...' />
    <span id="text">Loading</span>
  </div>
</body>

<script>
  if (container !== null) {
    const rotation = Math.random() * 3.1415 * 2;

    const vector = [Math.sin(rotaion), Math.cos(rotation)];

    let x = 0;
    let y = 0;

    const animate = function() {
      const actualLeft = window.innerWidth / 2 + x - container.offsetWidth / 2;
      const actualTop = window.innerHeight / 2 + y - container.offsetHeight / 2;
      const actualRight = actualLeft + container.offsetWidth;
      const actualBottom = actualTop + container.offsetHeight;

      if (actualLeft <= 0 || actualRight >= window.innerWidth) {
        vector[ 0 ] = -vector[ 0 ];
      }
      if (actualTop <= 0 || actualBottom >= window.innerHeight) {
        vector[ 1 ] = -vector[ 1 ];
      }

      x += vector[ 0 ];
      y += vector[ 1 ];

      container.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

      requestAnimationFrame(animate);
    };

    requestAnimationFrame(animate);
  }

  if (text !== null) {
    setInterval(function() {
      const dots = (text.textContent.match(/\./g) || []).length;
      const newDots = (dots + 1) % 4;
      text.textContent = text.textContent.replace(/\.*$/, '.'.repeat(newDots));
    }, 500);
  }
</script>

</html>
