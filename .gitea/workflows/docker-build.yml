name: Build and Push Docker Image

on:
  push:
    # branches: [goldsrc]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[CI]') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tags=(dev)
          elif [[ "$REF" == refs/tags/* ]]; then
            tags=("$REF_NAME" latest)
          else
            tags=("${COMMIT_SHA::7}" staging)
          fi

          {
            echo "tags<<EOF"
            for tag in "${tags[@]}"; do
              echo "$IMAGE:$tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
