name: Build and Push Docker Image

on:
  push:
    # branches: [goldsrc]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[CI]') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          # ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success() && (contains(github.event.head_commit.message, '[CI]') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')

    steps:
      - name: Deploy to server via SSH
        run: |
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT || '22' }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

          echo "${{ secrets.DEPLOY_SSH_KEY }" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -o "IdentitiesOnly=yes" -i /tmp/deploy_key -p ${{ secrets.DEPLOY_PORT || '22' }} ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Pulling latest image..."
            docker compose pull
            echo "Starting updated containers..."
            docker compose up -d
            echo "Cleaning up unused images..."
            docker image prune -f
          EOF
